<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Piket Santri</title>
    
    <!-- Menggunakan Tailwind CSS untuk styling yang cepat dan responsif -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Konfigurasi warna kustom untuk tema Pesantren/Islami yang segar (Hijau Zamrud) -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        emerald: {
                            50: '#ecfdf5',
                            100: '#d1fae5',
                            500: '#10b981',
                            600: '#059669',
                            700: '#047857',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    
    <!-- Mengambil font Inter dari Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Mengambil Ikon dari FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* Animasi sederhana untuk elemen yang muncul */
        .fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* Kustomisasi scrollbar agar lebih rapi */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1; 
        }
        ::-webkit-scrollbar-thumb {
            background: #10b981; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #059669; 
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen font-sans">

    <!-- Navbar / Header Aplikasi -->
    <header class="bg-emerald-600 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <i class="fa-solid fa-broom text-2xl"></i>
                <h1 class="text-xl md:text-2xl font-bold tracking-wide">Smart Piket Santri</h1>
                <!-- Indikator Live Tersinkronisasi -->
                <span id="cloudStatus" class="hidden text-xs bg-emerald-800 px-2 py-1 rounded-full text-emerald-100 items-center gap-1 shadow-inner">
                    <i class="fa-solid fa-cloud-arrow-up text-emerald-300"></i> Live
                </span>
            </div>
            <p class="hidden md:block text-emerald-100 text-sm italic">"Kebersihan adalah sebagian dari iman"</p>
        </div>
    </header>

    <!-- Kontainer Utama -->
    <main class="max-w-6xl mx-auto px-4 py-8 grid grid-cols-1 lg:grid-cols-3 gap-8">
        
        <!-- Bagian Kiri: Formulir Input -->
        <section class="lg:col-span-1">
            <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 sticky top-24">
                <h2 class="text-lg font-semibold text-gray-700 mb-4 border-b pb-2 flex items-center gap-2">
                    <i class="fa-solid fa-user-plus text-emerald-500"></i> Tambah Jadwal
                </h2>
                
                <form id="piketForm" class="space-y-4">
                    <!-- Input Nama Santri -->
                    <div>
                        <label for="namaSantri" class="block text-sm font-medium text-gray-600 mb-1">Nama Santri</label>
                        <input type="text" id="namaSantri" required placeholder="Contoh: Ahmad" 
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition-all">
                    </div>

                    <!-- Pilihan Hari -->
                    <div>
                        <label for="hariPiket" class="block text-sm font-medium text-gray-600 mb-1">Hari Piket</label>
                        <select id="hariPiket" required
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition-all appearance-none bg-white">
                            <option value="" disabled selected>Pilih Hari...</option>
                            <option value="Senin">Senin</option>
                            <option value="Selasa">Selasa</option>
                            <option value="Rabu">Rabu</option>
                            <option value="Kamis">Kamis</option>
                            <option value="Jumat">Jumat</option>
                            <option value="Sabtu">Sabtu</option>
                            <option value="Minggu">Minggu</option>
                        </select>
                    </div>

                    <!-- Pilihan Tugas -->
                    <div>
                        <label for="tugasPiket" class="block text-sm font-medium text-gray-600 mb-1">Tugas Utama</label>
                        <select id="tugasPiket" required
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition-all appearance-none bg-white">
                            <option value="" disabled selected>Pilih Tugas...</option>
                            <option value="Menyapu Asrama">Menyapu Asrama</option>
                            <option value="Mengepel Lorong">Mengepel Lorong</option>
                            <option value="Membersihkan Kamar Mandi">Kamar Mandi</option>
                            <option value="Membuang Sampah">Membuang Sampah</option>
                            <option value="Merapikan Sandal">Merapikan Sandal</option>
                            <option value="Keamanan/Jaga Malam">Keamanan</option>
                        </select>
                    </div>

                    <!-- Tombol Simpan -->
                    <button type="submit" 
                        class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2.5 rounded-lg transition-colors shadow-sm flex justify-center items-center gap-2 mt-2">
                        <i class="fa-solid fa-plus"></i> Simpan Jadwal
                    </button>
                </form>
            </div>
        </section>

        <!-- Bagian Kanan: Tampilan Jadwal -->
        <section class="lg:col-span-2">
            <!-- Header Tampilan Jadwal dengan Tombol Reset -->
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold text-gray-800 flex items-center gap-2">
                    <i class="fa-regular fa-calendar-check text-emerald-500"></i> Papan Jadwal
                </h2>
                <button onclick="bukaModalKosongkan()" class="text-sm text-red-500 hover:text-red-700 font-medium flex items-center gap-1 bg-red-50 hover:bg-red-100 px-3 py-1.5 rounded-md transition-colors">
                    <i class="fa-solid fa-trash-can"></i> Kosongkan
                </button>
            </div>

            <!-- Grid Hari (Akan diisi oleh JavaScript) -->
            <div id="scheduleGrid" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- Elemen hari akan di-render di sini -->
            </div>
        </section>
    </main>

    <!-- Notifikasi Toast (Pengganti Alert) -->
    <div id="toast" class="fixed bottom-5 right-5 transform translate-y-20 opacity-0 transition-all duration-300 z-50">
        <div class="bg-gray-800 text-white px-6 py-3 rounded-lg shadow-lg flex items-center gap-3">
            <i id="toastIcon" class="fa-solid fa-circle-check text-emerald-400"></i>
            <span id="toastMessage" class="font-medium">Pesan notifikasi di sini</span>
        </div>
    </div>

    <!-- Modal Konfirmasi Hapus Semua (Pengganti confirm()) -->
    <div id="confirmModal" class="fixed inset-0 bg-gray-900 bg-opacity-50 hidden items-center justify-center z-50 transition-opacity">
        <div class="bg-white rounded-2xl p-6 max-w-sm w-full mx-4 shadow-2xl">
            <h3 class="text-lg font-bold text-gray-800 mb-2 flex items-center gap-2">
                <i class="fa-solid fa-triangle-exclamation text-red-500"></i> Kosongkan Jadwal?
            </h3>
            <p class="text-gray-600 mb-6 text-sm">Apakah Anda yakin ingin menghapus semua jadwal piket? Tindakan ini tidak dapat dibatalkan.</p>
            <div class="flex justify-end gap-3">
                <button onclick="tutupModalKosongkan()" class="px-4 py-2 text-sm font-medium text-gray-700 bg-gray-100 hover:bg-gray-200 rounded-lg transition-colors">Batal</button>
                <button onclick="konfirmasiKosongkan()" class="px-4 py-2 text-sm font-medium text-white bg-red-600 hover:bg-red-700 rounded-lg transition-colors shadow-sm">Ya, Kosongkan</button>
            </div>
        </div>
    </div>

    <!-- JavaScript Logika Aplikasi -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, collection, onSnapshot, addDoc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Daftar hari berurutan
        const namaHari = ['Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu', 'Minggu'];
        let daftarPiket = [];
        
        // 1. Konfigurasi Penyimpanan Data Permanen Terpusat (Bisa diakses semua device/akun)
        let db, jadawalRef, appId, isCloud = false;
        
        try {
            appId = typeof __app_id !== 'undefined' ? __app_id : 'smart-piket-default';
            const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : null;
            
            if (firebaseConfig) {
                const app = initializeApp(firebaseConfig);
                const auth = getAuth(app);
                db = getFirestore(app);
                
                // Menyiapkan referensi database awan PUBLIK (agar semua orang melihat data yang sama)
                jadawalRef = collection(db, 'artifacts', appId, 'public', 'data', 'jadwalPiket');
                
                const initAuth = async () => {
                    // Otentikasi
                    if (typeof __initial_auth_token !== 'undefined') {
                        await signInWithCustomToken(auth, __initial_auth_token);
                    } else {
                        await signInAnonymously(auth);
                    }
                    
                    if (!auth.currentUser) return;
                    isCloud = true;

                    // Tampilkan indikator Live/Sinkronisasi di UI
                    const cloudStatus = document.getElementById('cloudStatus');
                    if(cloudStatus) {
                        cloudStatus.classList.remove('hidden');
                        cloudStatus.classList.add('flex');
                    }
                    
                    // Mendengarkan perubahan data di Cloud secara real-time untuk SEMUA perangkat
                    onSnapshot(jadawalRef, (snapshot) => {
                        daftarPiket = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                        window.renderJadwal();
                    }, (error) => {
                        console.error("Gagal memuat data dari cloud:", error);
                        window.tampilkanToast("Terjadi kesalahan sinkronisasi data.", "danger");
                    });
                };
                initAuth();
            }
        } catch (error) {
            console.log("Menjalankan dalam mode lokal", error);
        }

        // Jika tidak tersambung cloud, gunakan penyimpanan lokal browser
        if (!isCloud) {
            daftarPiket = JSON.parse(localStorage.getItem('dataPiketSantri')) || [];
            window.onload = () => window.renderJadwal();
        }

        // 2. Fungsi untuk merender (menampilkan) jadwal ke layar
        window.renderJadwal = function() {
            const grid = document.getElementById('scheduleGrid');
            grid.innerHTML = ''; 

            namaHari.forEach(hari => {
                const piketHariIni = daftarPiket.filter(piket => piket.hari === hari);

                const card = document.createElement('div');
                card.className = 'bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden fade-in';
                
                let cardHTML = `
                    <div class="bg-emerald-50 px-4 py-3 border-b border-emerald-100 flex justify-between items-center">
                        <h3 class="font-bold text-emerald-800">${hari}</h3>
                        <span class="text-xs font-semibold bg-emerald-200 text-emerald-800 px-2 py-1 rounded-full">
                            ${piketHariIni.length} Orang
                        </span>
                    </div>
                    <ul class="p-0 m-0 divide-y divide-gray-100">
                `;

                if (piketHariIni.length === 0) {
                    cardHTML += `<li class="px-4 py-6 text-center text-gray-400 text-sm italic">Belum ada jadwal</li>`;
                } else {
                    piketHariIni.forEach(piket => {
                        const textStyle = piket.selesai ? 'line-through text-gray-400' : 'text-gray-700';
                        const checkIcon = piket.selesai ? 'fa-solid fa-circle-check text-emerald-500' : 'fa-regular fa-circle text-gray-300';
                        const bgStyle = piket.selesai ? 'bg-gray-50' : 'bg-white hover:bg-gray-50';

                        cardHTML += `
                            <li class="px-4 py-3 flex justify-between items-center transition-colors ${bgStyle} group">
                                <div class="flex items-center gap-3 cursor-pointer" onclick="toggleStatus('${piket.id}')">
                                    <i class="${checkIcon} text-lg transition-colors group-hover:text-emerald-400"></i>
                                    <div>
                                        <p class="font-medium ${textStyle}">${piket.nama}</p>
                                        <p class="text-xs text-gray-500 flex items-center gap-1">
                                            <i class="fa-solid fa-tag text-emerald-400"></i> ${piket.tugas}
                                        </p>
                                    </div>
                                </div>
                                <button onclick="hapusPiket('${piket.id}')" class="text-gray-300 hover:text-red-500 transition-colors p-2" title="Hapus">
                                    <i class="fa-solid fa-xmark"></i>
                                </button>
                            </li>
                        `;
                    });
                }
                cardHTML += `</ul>`;
                card.innerHTML = cardHTML;
                grid.appendChild(card);
            });
        };

        // 3. Menangani Pengiriman Formulir (Tambah Data)
        document.getElementById('piketForm').addEventListener('submit', async function(e) {
            e.preventDefault(); 
            const nama = document.getElementById('namaSantri').value.trim();
            const hari = document.getElementById('hariPiket').value;
            const tugas = document.getElementById('tugasPiket').value;

            const dataBaru = { nama, hari, tugas, selesai: false };

            if (isCloud && jadawalRef) {
                // Simpan ke Cloud Database (Tersinkronisasi Semua Device)
                await addDoc(jadawalRef, dataBaru);
            } else {
                // Simpan secara lokal (mode fallback)
                dataBaru.id = Date.now().toString();
                daftarPiket.push(dataBaru);
                localStorage.setItem('dataPiketSantri', JSON.stringify(daftarPiket));
                window.renderJadwal();
            }
            
            this.reset();
            window.tampilkanToast(`Berhasil menambahkan ${nama} ke hari ${hari}!`, 'success');
        });

        // 4. Fungsi Mengubah Status Selesai/Belum Selesai
        window.toggleStatus = async function(id) {
            const piket = daftarPiket.find(p => p.id === id);
            if (!piket) return;

            if (isCloud && db) {
                // Update ke Cloud Database (Tersinkronisasi)
                const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'jadwalPiket', id);
                await updateDoc(docRef, { selesai: !piket.selesai });
            } else {
                piket.selesai = !piket.selesai;
                localStorage.setItem('dataPiketSantri', JSON.stringify(daftarPiket));
                window.renderJadwal();
            }
        };

        // 5. Fungsi Menghapus Satu Data Piket
        window.hapusPiket = async function(id) {
            if (isCloud && db) {
                // Hapus dari Cloud (Hilang di semua device)
                const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'jadwalPiket', id);
                await deleteDoc(docRef);
            } else {
                daftarPiket = daftarPiket.filter(p => p.id !== id);
                localStorage.setItem('dataPiketSantri', JSON.stringify(daftarPiket));
                window.renderJadwal();
            }
            window.tampilkanToast('Jadwal berhasil dihapus.', 'info');
        };

        // 6. Fungsi Buka/Tutup Modal Konfirmasi Kosongkan
        window.bukaModalKosongkan = function() {
            document.getElementById('confirmModal').classList.remove('hidden');
            document.getElementById('confirmModal').classList.add('flex');
        };

        window.tutupModalKosongkan = function() {
            document.getElementById('confirmModal').classList.add('hidden');
            document.getElementById('confirmModal').classList.remove('flex');
        };

        // 7. Fungsi Konfirmasi Menghapus Semua Data
        window.konfirmasiKosongkan = async function() {
            if (isCloud && db) {
                // Hapus satu per satu dari cloud database untuk semua orang
                for (const piket of daftarPiket) {
                    const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'jadwalPiket', piket.id);
                    await deleteDoc(docRef);
                }
            } else {
                daftarPiket = [];
                localStorage.setItem('dataPiketSantri', JSON.stringify(daftarPiket));
                window.renderJadwal();
            }
            window.tutupModalKosongkan();
            window.tampilkanToast('Semua jadwal telah dikosongkan.', 'danger');
        };

        // 8. Fungsi Notifikasi Toast 
        window.tampilkanToast = function(pesan, tipe = 'success') {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toastMessage');
            const toastIcon = document.getElementById('toastIcon');

            toastMessage.textContent = pesan;
            
            if(tipe === 'success') toastIcon.className = "fa-solid fa-circle-check text-emerald-400";
            else if(tipe === 'danger') toastIcon.className = "fa-solid fa-triangle-exclamation text-red-400";
            else toastIcon.className = "fa-solid fa-circle-info text-blue-400";

            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        };
    </script>
</body>
</html>
